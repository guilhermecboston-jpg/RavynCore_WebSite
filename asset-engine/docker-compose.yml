services:
  ravyn-asset-engine:
    build: .
    container_name: ravyn-asset-engine
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      RAVYN_OTC_ROOT: /otclient
    volumes:
      - ../RavynCore_OTC:/otclient:ro
      - ../public/cache/asset-engine:/app/cache
    command: ["python", "main.py", "serve", "--host", "0.0.0.0", "--port", "8765"]
