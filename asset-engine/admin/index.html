<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RavynCore Asset Engine</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --accent:#7c5cff; --ok:#3dd68c; --err:#ff6b6b; --text:#e7ecf3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    h1 { margin:0 0 8px; font-size:1.5rem; }
    .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; max-width:720px; }
    .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:.85rem; }
    .ok { background:rgba(61,214,140,.15); color:var(--ok); }
    .err { background:rgba(255,107,107,.15); color:var(--err); }
    button { background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    pre { background:#0b1016; padding:12px; border-radius:8px; overflow:auto; font-size:.85rem; }
    label { display:block; margin:8px 0 4px; font-size:.9rem; opacity:.85; }
    input { width:100%; max-width:280px; padding:8px; border-radius:6px; border:1px solid #2a3548; background:#0b1016; color:var(--text); }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:end; margin-top:12px; }
  </style>
</head>
<body>
  <h1>RavynCore Asset Engine</h1>
  <p>Painel admin — status dos assets OTC e regeneração de cache.</p>

  <div class="card">
    <div id="badge" class="badge">Carregando…</div>
    <p id="message" style="margin:12px 0 0"></p>
    <div class="row">
      <button id="btnRefresh">Atualizar status</button>
      <button id="btnRegen">Regenerar cache</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;font-size:1.1rem">Pré-visualização</h2>
    <div class="row">
      <div>
        <label>Outfit ID</label>
        <input id="outfitId" type="number" value="128" />
      </div>
      <div>
        <label>Addons</label>
        <input id="addons" type="number" value="0" min="0" max="3" />
      </div>
      <button id="btnPreview">Renderizar</button>
    </div>
    <p style="margin-top:16px"><img id="preview" alt="preview" style="image-rendering:pixelated;min-height:64px;background:#0b1016;border-radius:8px" /></p>
  </div>

  <div class="card">
    <h2 style="margin-top:0;font-size:1.1rem">Detalhes</h2>
    <pre id="details">—</pre>
  </div>

  <script>
    const api = '';
    async function loadStatus() {
      const res = await fetch(api + '/api/status');
      const data = await res.json();
      const badge = document.getElementById('badge');
      const msg = document.getElementById('message');
      badge.textContent = data.enabled ? 'Motor moderno ativo' : 'Modo legado';
      badge.className = 'badge ' + (data.enabled ? 'ok' : 'err');
      msg.textContent = data.message || '';
      document.getElementById('details').textContent = JSON.stringify(data, null, 2);
      document.getElementById('btnRegen').disabled = !data.enabled;
    }
    document.getElementById('btnRefresh').onclick = loadStatus;
    document.getElementById('btnRegen').onclick = async () => {
      const res = await fetch(api + '/api/cache/regenerate', { method: 'POST' });
      const data = await res.json();
      alert(data.message || JSON.stringify(data));
      loadStatus();
    };
    document.getElementById('btnPreview').onclick = () => {
      const id = document.getElementById('outfitId').value;
      const addons = document.getElementById('addons').value;
      document.getElementById('preview').src =
        api + '/api/outfit?id=' + encodeURIComponent(id) + '&addons=' + encodeURIComponent(addons) + '&_=' + Date.now();
    };
    loadStatus();
  </script>
</body>
</html>
